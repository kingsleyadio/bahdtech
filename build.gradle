// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.21'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.pkg.github.com/kingsleyadio/android_commons"
            credentials.username = prop("GITHUB_ACTOR")
            credentials.password = prop("GITHUB_TOKEN")
        }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    }
}

subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}


String prop(String key, String fallback = "") {
    return providers.gradleProperty(key)
        .forUseAtConfigurationTime()
        .orElse(providers.environmentVariable(key))
        .orNull
        ?: fallback.ifEmpty { error("$key not found") }
}
